services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: study-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studyhub
      POSTGRES_PASSWORD: studyhub_password
      POSTGRES_DB: studyhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: